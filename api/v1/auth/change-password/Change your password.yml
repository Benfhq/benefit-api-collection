info:
  name: Change your password
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/api/v1/auth/change-password"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "current_password": "gwbP9SarEWhf",
        "new_password": "Chronon@1234"
      }
  auth:
    type: bearer
    token: "{{auth_token}}"

runtime:
  variables:
    - name: bearerToken
      value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..VfgKGzITC1FeVBG5Ep6il3ZN7b07-XvP1vqQR0aVkuU

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: "{{baseUrl}}/api/v1/auth/change-password"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
        - name: Accept
          value: application/json
        - name: Authorization
          value: Bearer <token>
      body:
        type: json
        data: |-
          {
            "current_password": "string",
            "new_password": "stringstring"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "persona": "corporate_admin",
            "access_token": null,
            "refresh_token": "string",
            "expires_in": 1939,
            "token_type": "bearer",
            "must_change_password": false
          }
  - name: Validation Error
    request:
      url: "{{baseUrl}}/api/v1/auth/change-password"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
        - name: Accept
          value: application/json
        - name: Authorization
          value: Bearer <token>
      body:
        type: json
        data: |-
          {
            "current_password": "string",
            "new_password": "stringstring"
          }
    response:
      status: 422
      statusText: Unprocessable Entity (WebDAV) (RFC 4918)
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": [
              {
                "loc": [
                  "string",
                  4591
                ],
                "msg": "string",
                "type": "string",
                "input": "",
                "ctx": {}
              },
              {
