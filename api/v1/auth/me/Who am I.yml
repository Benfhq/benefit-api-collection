info:
  name: Who am I
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/auth/me"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{bearerToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: "{{baseUrl}}/api/v1/auth/me"
      method: GET
      headers:
        - name: Accept
          value: application/json
        - name: Authorization
          value: Bearer <token>
          description: "Added as a part of security scheme: bearer"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "persona": "employee",
            "email": "string",
            "full_name": "string",
            "user_id": "d0b7e223-9d90-8478-6511-53a7bb418773",
            "must_change_password": false,
