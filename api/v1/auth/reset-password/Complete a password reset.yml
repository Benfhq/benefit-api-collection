info:
  name: Complete a password reset
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/reset-password"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "token": "string",
        "new_password": "stringstring"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: "{{baseUrl}}/api/v1/auth/reset-password"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "token": "string",
            "new_password": "stringstring"
          }
    response:
      status: 204
      statusText: No Content
      body:
        type: text
        data: ""
  - name: Validation Error
    request:
      url: "{{baseUrl}}/api/v1/auth/reset-password"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
        - name: Accept
          value: application/json
      body:
        type: json
        data: |-
          {
            "token": "string",
            "new_password": "stringstring"
          }
    response:
      status: 422
      statusText: Unprocessable Entity (WebDAV) (RFC 4918)
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": [
              {
                "loc": [
                  "string",
                  4591
                ],
                "msg": "string",
                "type": "string",
                "input": "",
                "ctx": {}
              },
              {
                "loc": [
                  "string",
                  5818
                ],
                "msg": "string",
                "type": "string",
                "input": "",
                "ctx": {}
              }
            ]
          }
