info:
  name: Confirm RabbitMQ is reachable
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/system/broker"
  headers:
    - name: Accept
      value: application/json
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: "{{baseUrl}}/api/v1/system/broker"
      method: GET
      headers:
        - name: Accept
          value: application/json
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "connected": true,
            "host": "string",
            "vhost": "string"
          }
