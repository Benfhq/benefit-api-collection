info:
  name: Liveness of the API layer only
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/api/v1/system/ping"
  headers:
    - name: Accept
      value: application/json
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: "{{baseUrl}}/api/v1/system/ping"
      method: GET
      headers:
        - name: Accept
          value: application/json
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "env": "string",
            "message": "pong"
          }

docs: Touches nothing. Confirms routing, serialisation and config are wired.
