info:
  name: Read a task result from the backend
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/system/tasks/:task_id"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: task_id
      value: string
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: "{{baseUrl}}/api/v1/system/tasks/:task_id"
      method: GET
      headers:
        - name: Accept
          value: application/json
      params:
        - name: task_id
          value: string
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "task_id": "string",
            "state": "RETRY",
            "ready": true,
            "successful": null,
            "result": ""
          }
  - name: Validation Error
    request:
      url: "{{baseUrl}}/api/v1/system/tasks/:task_id"
      method: GET
      headers:
        - name: Accept
          value: application/json
      params:
        - name: task_id
          value: string
          type: path
    response:
      status: 422
      statusText: Unprocessable Entity (WebDAV) (RFC 4918)
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": [
              {
                "loc": [
                  "string",
                  4591
                ],
                "msg": "string",
                "type": "string",
                "input": "",
                "ctx": {}
              },
              {
                "loc": [
                  "string",
                  5818
                ],
                "msg": "string",
                "type": "string",
                "input": "",
                "ctx": {}
              }
            ]
          }
