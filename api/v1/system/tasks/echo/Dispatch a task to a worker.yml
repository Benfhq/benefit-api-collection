info:
  name: Dispatch a task to a worker
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/system/tasks/echo"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "message": "pong",
        "delay_seconds": 0
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: "{{baseUrl}}/api/v1/system/tasks/echo"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
        - name: Accept
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "pong",
            "delay_seconds": 0
          }
    response:
      status: 202
      statusText: Accepted
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "task_id": "string",
            "queue": "string"
          }
  - name: Validation Error
    request:
      url: "{{baseUrl}}/api/v1/system/tasks/echo"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
        - name: Accept
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "pong",
            "delay_seconds": 0
          }
    response:
      status: 422
      statusText: Unprocessable Entity (WebDAV) (RFC 4918)
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": [
              {
                "loc": [
                  "string",
                  4591
                ],
                "msg": "string",
                "type": "string",
                "input": "",
                "ctx": {}
              },
              {
                "loc": [
                  "string",
                  5818
                ],
                "msg": "string",
                "type": "string",
                "input": "",
                "ctx": {}
              }
            ]
          }

docs: |-
  Returns immediately with a task id; poll ``/tasks/{task_id}`` for the result.

  Set ``delay_seconds`` to watch the task sit in PENDING before it completes.
