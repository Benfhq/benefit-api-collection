info:
  name: Round-trip a query through Postgres
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/api/v1/system/db-time"
  headers:
    - name: Accept
      value: application/json
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: "{{baseUrl}}/api/v1/system/db-time"
      method: GET
      headers:
        - name: Accept
          value: application/json
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "db_time": "1995-09-18T18:34:11.063Z",
            "postgres_version": "string"
          }
