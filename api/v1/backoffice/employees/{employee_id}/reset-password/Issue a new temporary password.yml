info:
  name: Issue a new temporary password
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/backoffice/employees/:employee_id/reset-password"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: employee_id
      value: f6cf9c14-d010-b05d-5c3f-44341cff657d
      type: path
  auth:
    type: bearer
    token: "{{bearerToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: "{{baseUrl}}/api/v1/backoffice/employees/:employee_id/reset-password"
      method: POST
      headers:
        - name: Accept
          value: application/json
        - name: Authorization
          value: Bearer <token>
          description: "Added as a part of security scheme: bearer"
      params:
        - name: employee_id
          value: f6cf9c14-d010-b05d-5c3f-44341cff657d
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "employee_id": "c22e19b3-729e-cb9f-351f-bb0aa07a3251",
            "email": "string",
            "temp_password": "string"
          }
  - name: Validation Error
    request:
      url: "{{baseUrl}}/api/v1/backoffice/employees/:employee_id/reset-password"
      method: POST
      headers:
        - name: Accept
          value: application/json
        - name: Authorization
          value: Bearer <token>
          description: "Added as a part of security scheme: bearer"
      params:
        - name: employee_id
          value: f6cf9c14-d010-b05d-5c3f-44341cff657d
          type: path
    response:
      status: 422
      statusText: Unprocessable Entity (WebDAV) (RFC 4918)
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": [
              {
                "loc": [
                  "string",
                  4591
                ],
                "msg": "string",
                "type": "string",
                "input": "",
                "ctx": {}
              },
              {
