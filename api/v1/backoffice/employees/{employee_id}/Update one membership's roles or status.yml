info:
  name: Update one membership's roles or status
  type: http
  seq: 2

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/backoffice/employees/:employee_id"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: employee_id
      value: f6cf9c14-d010-b05d-5c3f-44341cff657d
      type: path
  body:
    type: json
    data: |-
      {
        "roles": null,
        "status": "suspended"
      }
  auth:
    type: bearer
    token: "{{bearerToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: "{{baseUrl}}/api/v1/backoffice/employees/:employee_id"
      method: PATCH
      headers:
        - name: Content-Type
          value: application/json
        - name: Accept
          value: application/json
        - name: Authorization
          value: Bearer <token>
          description: "Added as a part of security scheme: bearer"
      params:
        - name: employee_id
          value: f6cf9c14-d010-b05d-5c3f-44341cff657d
          type: path
      body:
        type: json
        data: |-
          {
            "roles": null,
            "status": "suspended"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "826aa073-084e-fed2-b1ac-251bf33bbda2",
