info:
  name: Update an entity
  type: http
  seq: 1

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/backoffice/entities/:entity_id"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: entity_id
      value: 97911f27-72b2-aefa-ddcb-bdfaada34d3f
      type: path
  body:
    type: json
    data: |-
      {
        "name": null,
        "country_code": null,
        "currency": null,
        "registration_no": "string",
        "tax_id": "string",
        "status": null
      }
  auth:
    type: bearer
    token: "{{bearerToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

