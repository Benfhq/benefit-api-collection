info:
  name: Add a legal entity
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/backoffice/organizations/:organization_id/entities"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: organization_id
      value: 49eda4d3-728a-4c01-8478-8a15a8a68b28
      type: path
  body:
    type: json
    data: |-
      {
        "name": "InboxOS India Private Limited",
        "code": "inboxos112",
        "country_code": "IN",
        "currency": "INR",
        "registration_no": null,
        "tax_id": null
      }
  auth:
    type: bearer
    token: "{{bearerToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
