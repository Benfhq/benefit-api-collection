info:
  name: Add a corporate admin, with one membership per entity they administer
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/v1/backoffice/organizations/:organization_id/admins"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: organization_id
      value: 49eda4d3-728a-4c01-8478-8a15a8a68b28
      type: path
  body:
    type: json
    data: |-
      {
        "email": "nilesh@chronon.co.in",
        "full_name": "Nilesh Pant",
        "entity_ids": [
          "abd88f0e-2da9-4a86-8168-45cf5cca649d"
        ],
        "roles": [
          "admin"
        ]
      }
  auth:
    type: bearer
    token: "{{bearerToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: "{{baseUrl}}/api/v1/backoffice/organizations/:organization_id/admins"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
        - name: Accept
          value: application/json
        - name: Authorization
          value: Bearer <token>
          description: "Added as a part of security scheme: bearer"
      params:
        - name: organization_id
          value: fd439814-7537-5822-bf7b-825a81b69845
          type: path
      body:
        type: json
        data: |-
          {
            "email": "zn9oT8GunV7Ul@XNjRJmeOZdLwxtKiHWPZHGRcozFHyDWHA.cwzh",
