info:
  name: Add a corporate admin, with one membership per entity they administer
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/api/v1/backoffice/organizations/{{org_id}}/admins"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |
      {
        "email": "elon@chronon.co.in",
        "full_name": "Elon Musk",
        "entity_ids": [
          "f0cffe85-5e5a-4cbe-b319-694c6f84b957"
        ],
        "roles": [
          "admin"
        ]
      }
  auth:
    type: bearer
    token: "{{auth_token}}"

runtime:
  variables:
    - name: bearerToken
      value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJvcHNAcGluZS5jb20iLCJwZXJzb25hIjoiYmFja29mZmljZSIsImVtcCI6bnVsbCwib3JnIjpudWxsLCJyZXN0cmljdGVkIjpmYWxzZSwidHlwIjoiYWNjZXNzIiwianRpIjoiODgwZTA5ZTctZDMwZC00NzRmLTg3MjYtNjA2ZDI5MGU3ZjM1IiwiaWF0IjoxNzg2NTI0NjcxLCJleHAiOjE3ODY1NTM0NzF9.qIyrZkDB6FPEmuRzQVZbXNufq24Y8TESuDFC4cVEozY

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

