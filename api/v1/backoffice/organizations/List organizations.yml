info:
  name: List organizations
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v1/backoffice/organizations?page=1&page_size=50"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: page
      value: "1"
      type: query
    - name: page_size
      value: "50"
      type: query
  auth:
    type: bearer
    token: "{{bearerToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: "{{baseUrl}}/api/v1/backoffice/organizations?status=onboarding&q=string&page=1&page_size=50"
      method: GET
      headers:
        - name: Accept
          value: application/json
        - name: Authorization
          value: Bearer <token>
          description: "Added as a part of security scheme: bearer"
      params:
        - name: status
          value: onboarding
          type: query
        - name: q
          value: string
          type: query
        - name: page
          value: "1"
          type: query
        - name: page_size
          value: "50"
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "items": [
              {
                "id": "b4155c33-ce2e-3272-fc3f-e5edeedce8cc",
                "name": "string",
                "slug": "string",
                "status": "active",
                "primary_contact_name": null,
