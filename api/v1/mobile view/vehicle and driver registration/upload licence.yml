info:
  name: upload licence
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/api/v1/files"
  body:
    type: json
    data: |
      {
        "name": "licence.pdf",
        "content_type": "application/pdf"
      }
  auth:
    type: bearer
    token: "{{auth_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
