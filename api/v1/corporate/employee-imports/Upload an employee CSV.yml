info:
  name: Upload an employee CSV
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/api/v1/corporate/employee-imports"
  headers:
    - name: Content-Type
      value: multipart/form-data
    - name: Accept
      value: application/json
  body:
    type: multipart-form
    data:
      - name: entity_id
        type: text
        value: ca5462a9-fd9d-885b-969b-33a84798d153
      - name: file
        type: text
        value: string
  auth:
    type: bearer
    token: "{{bearerToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
