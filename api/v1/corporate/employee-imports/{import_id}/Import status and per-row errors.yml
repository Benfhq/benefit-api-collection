info:
  name: Import status and per-row errors
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/api/v1/corporate/employee-imports/:import_id"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: import_id
      value: ad8dadeb-e6b3-4d51-86b0-dfc3ceb7a2f8
      type: path
  auth:
    type: bearer
    token: "{{auth_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
