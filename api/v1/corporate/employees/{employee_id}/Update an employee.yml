info:
  name: Update an employee
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/corporate/employees/:employee_id"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: employee_id
      value: f6cf9c14-d010-b05d-5c3f-44341cff657d
      type: path
  body:
    type: json
    data: |-
      {
        "full_name": null,
        "employee_code": "string",
        "department": "string",
        "job_title": null,
        "joined_at": null
      }
  auth:
    type: bearer
    token: "{{bearerToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

