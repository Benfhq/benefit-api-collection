info:
  name: Get an employee
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/api/v1/corporate/employees/:employee_id"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: employee_id
      value: f6cf9c14-d010-b05d-5c3f-44341cff657d
      type: path
  auth:
    type: bearer
    token: "{{bearerToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

