info:
  name: Issue a new temporary password
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/corporate/employees/:employee_id/reset-password"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: employee_id
      value: f6cf9c14-d010-b05d-5c3f-44341cff657d
      type: path
  auth:
    type: bearer
    token: "{{bearerToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: "{{baseUrl}}/api/v1/corporate/employees/:employee_id/reset-password"
      method: POST
      headers:
        - name: Accept
          value: application/json
        - name: Authorization
          value: Bearer <token>
          description: "Added as a part of security scheme: bearer"
      params:
        - name: employee_id
          value: f6cf9c14-d010-b05d-5c3f-44341cff657d
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "employee": {
              "id": "99cc0ae0-db46-602d-b92c-05379a8a482f",
