info:
  name: Create an employee
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/v1/corporate/employees"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |
      {
        "entity_id": "{{entity_id}}",
        "email": "giri@chronon.co.in",
        "full_name": "Giridhar Chronon",
        "employee_code": "EMP004",
        "job_title": "Sales Software Engineer",
        "joined_at": "2025-11-18",
        "option_ids": ["e3c165e2-8e71-401c-a699-9a9117b76b49", "7ee0fa21-b242-436e-9f63-1ad2fcfdda80"]
      }
  auth:
    type: bearer
    token: "{{auth_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Successful Response
    request:
      url: "{{baseUrl}}/api/v1/corporate/employees"
      method: POST
      headers:
        - name: Content-Type
          value: application/json
        - name: Accept
          value: application/json
        - name: Authorization
          value: Bearer <token>
      body:
        type: json
        data: |-
          {
            "entity_id": "ee6a79cb-3841-17be-96fc-35c369e7842a",
            "email": "r6AL3ZpM5JAeW@bXinInWH.tqjs",
            "full_name": "string",
            "employee_code": null,
            "department": "string",
            "job_title": "string",
            "joined_at": "2021-09-29"
          }
