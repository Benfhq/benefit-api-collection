info:
  name: create benefit policy
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/corporate/benefit-policies"
  body:
    type: json
    data: |
      {
        "benefit_id": "89f3f66b-1cf2-4585-aa1c-cfaec2ce93c3",
        "name": "Standard Meal Policy",
        "description": "Weekday meal spend for full-time staff.",
        "policy_type": "standard",
        "load_limit": {
          "amount": "5000.00",
          "frequency": "monthly"
