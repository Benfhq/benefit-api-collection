info:
  name: extract details
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/api/v1/files/{{file_id}}/extract"
  body:
    type: json
    data: '{"document_type":"receipt"}'
  auth:
    type: bearer
    token: "{{auth_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
