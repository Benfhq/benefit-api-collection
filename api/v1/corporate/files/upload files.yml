info:
  name: upload files
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/api/v1/files"
  body:
    type: json
    data: |
      {
        "name": "bill.jpg",
        "content_type": "image/jpeg"
      }
  auth:
    type: bearer
    token: "{{auth_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
